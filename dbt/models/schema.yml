version: 2

sources:
  - name: raw_flight_data
    tables:
      - name: raw_flights
        columns:
          - name: airline
            tests:
              - not_null
          - name: source_city
            tests:
              - not_null
          - name: destination_city
            tests:
              - not_null
          - name: price
            tests:
              - not_null
          - name: days_left
            tests:
              - not_null

models:
  - name: stg_flight_data
    columns:
      - name: flight_number
        tests:
          - not_null
      - name: source_city
        tests:
          - not_null
      - name: destination_city
        tests:
          - not_null
      - name: price
        tests:
          - not_null
      - name: flight_date
        tests:
          - not_null
  - name: fct_flight_prices
    columns:
      - name: flight_date
        tests:
          - not_null
      - name: source_city
        tests:
          - not_null
      - name: total_flights
        tests:
          - not_null
