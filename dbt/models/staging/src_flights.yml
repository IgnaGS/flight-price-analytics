version: 2

sources:
  - name: raw_flight_data
    database: "{{ env_var('GCP_PROJECT_ID') }}"
    schema: "{{ env_var('RAW_DATASET', 'raw_dataset') }}"
    tables:
      - name: raw_flights
        identifier: "{{ env_var('RAW_TABLE_NAME', 'raw_flight_data') }}"
        columns:
          - name: airline
            tests:
              - not_null
          - name: source_city
            tests:
              - not_null
          - name: destination_city
            tests:
              - not_null
          - name: price
            tests:
              - not_null
          - name: days_left
            tests:
              - not_null
