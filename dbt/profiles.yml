flight_analytics:
  target: dev
  outputs:
    dev:
      type: bigquery
      method: service-account
      project: "{{ env_var('GCP_PROJECT_ID') }}"
      dataset: "{{ env_var('DBT_DATASET', 'dbt_dev') }}"
      location: "{{ env_var('GCP_LOCATION', 'US') }}"
      keyfile: "{{ env_var('GCP_KEY_PATH') }}"
      priority: interactive
      threads: 4