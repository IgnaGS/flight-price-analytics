volumes:
  kestra_data:
    driver: local
  kestra_tmp:
    driver: local
  kestra_postgres_data:
    driver: local

services:
  kestra_postgres:
    image: postgres:18
    volumes:
      - kestra_postgres_data:/var/lib/postgresql
    environment:
      POSTGRES_DB: kestra
      POSTGRES_USER: kestra
      POSTGRES_PASSWORD: k3str4
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}"]
      interval: 30s
      timeout: 10s
      retries: 10

  kestra:
    image: kestra/kestra:v1.1
    pull_policy: if_not_present  # set to "always" for pulling the image from internet.
    # Note that this setup with a root user is intended for development purpose.
    # Our base image runs without root, but the Docker Compose implementation needs root to access the Docker socket
    # To run Kestra in a rootless mode in production, see: https://kestra.io/docs/installation/podman-compose
    user: "root"
    command: server standalone
    volumes:
      - kestra_data:/app/storage
      - /var/run/docker.sock:/var/run/docker.sock
      - kestra_tmp:/tmp/kestra-wd
      - ./flows:/app/flows
      - /home/nacho/flight-price-analytics:/workspace
    env_file:
      - .env
    environment:
      KESTRA_CONFIGURATION: |
        datasources:
          postgres:
            url: jdbc:postgresql://kestra_postgres:5432/kestra
            driverClassName: org.postgresql.Driver
            username: kestra
            password: k3str4
        kestra:
          server:
            basicAuth:
              username: "admin@kestra.io" # it must be a valid email address
              password: Admin1234!
          repository:
            type: postgres
          storage:
            type: local
            local:
              basePath: "/app/storage"
          queue:
            type: postgres
          tasks:
            tmpDir:
              path: /tmp/kestra-wd/tmp
          url: http://localhost:8080/
    ports:
      - "8080:8080"
      - "8081:8081"
    depends_on:
      kestra_postgres:
        condition: service_healthy

  kestra_flows_loader:
    image: curlimages/curl:latest
    volumes:
      - ./flows:/app/flows
      - ./load_flows.sh:/load_flows.sh
    depends_on:
      kestra:
        condition: service_started
    entrypoint: /bin/sh
    command:
      - -c
      - |
        echo "Waiting for Kestra to be ready..."
        for i in {1..30}; do
          if curl -s -f -u admin@kestra.io:Admin1234! http://kestra:8080/api/v1/info > /dev/null 2>&1; then
            echo "Kestra is ready!"
            break
          fi
          echo "Attempt $i/30 - waiting for Kestra..."
          sleep 2
        done

        echo "Loading flows from /app/flows..."
        for flow_file in /app/flows/*.yaml; do
          if [ -f "$flow_file" ]; then
            echo "Loading $flow_file..."
            curl -X POST -u admin@kestra.io:Admin1234! \
              -H "Content-Type: application/x-yaml" \
              --data-binary @"$flow_file" \
              http://kestra:8080/api/v1/flows
            echo ""
            echo "Loaded: $flow_file"
          fi
        done

        echo "All flows loaded successfully!"
    