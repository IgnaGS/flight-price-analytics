id: 01_flight_price_pipeline
namespace: flight-prices

inputs:
  - id: bucket
    type: STRING
    defaults: "{{ kv('GCP_BUCKET_NAME') }}" 
  - id: dataset
    type: STRING
    defaults: "{{ kv('GCP_DATASET') }}" 

tasks:
  # It's necessary to manually load the file to kestra namespace, before running the pipeline. This is because the file is not available in the docker container, and we need to copy it to the container before running the pipeline.
  - id: convert_csv_to_parquet
    type: io.kestra.plugin.scripts.python.Script
    containerImage: ghcr.io/kestra-io/pydata:latest
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    namespaceFiles:
      enabled: true
      include:
        - flight_data.csv
    script: |
      import pandas as pd
      import os
      
      print("Available files:", os.listdir('.'))
      df = pd.read_csv('flight_data.csv')
      df.to_parquet('flight_data.parquet')
      print(f"Success: Dataset loaded and converted with {len(df)} rows.")
    outputFiles:
      - flight_data.parquet

  - id: upload_to_gcs
    type: io.kestra.plugin.gcp.gcs.Upload
    serviceAccount: "{{ secret('GCP_SERVICE_ACCOUNT') }}"
    from: "{{ outputs.convert_csv_to_parquet.outputFiles['flight_data.parquet'] }}"
    to: "gs://{{ inputs.bucket }}/flight_data.parquet"

  - id: load_to_bigquery
    type: io.kestra.plugin.gcp.bigquery.LoadFromGcs
    serviceAccount: "{{ secret('GCP_SERVICE_ACCOUNT') }}"
    from: 
      - "gs://{{ inputs.bucket }}/flight_data.parquet"
    destinationTable: "{{ inputs.dataset }}.raw_flight_data"
    format: PARQUET
    writeDisposition: WRITE_TRUNCATE